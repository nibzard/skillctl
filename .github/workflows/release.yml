name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: skillctl
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: skillctl
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: skillctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: skillctl.exe
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Validate release ref
        shell: bash
        run: |
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "release builds must target an existing v* tag" >&2
            exit 1
          fi
      # dtolnay/rust-toolchain branch stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache v2.8.0
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke test first run
        shell: bash
        run: |
          home_dir="$RUNNER_TEMP/skillctl-home"
          work_dir="$RUNNER_TEMP/skillctl-work"
          rm -rf "$home_dir" "$work_dir"
          mkdir -p "$home_dir" "$work_dir"
          bash scripts/release-smoke-test.sh \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --home "$home_dir" \
            --workdir "$work_dir"
      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/package-release.sh \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --version "${RELEASE_TAG}" \
            --target "${{ matrix.target }}" \
            --output dist
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Validate release ref
        shell: bash
        run: |
          if [[ -z "${RELEASE_TAG}" || "${RELEASE_TAG}" != v* ]]; then
            echo "release publish must target an existing v* tag" >&2
            exit 1
          fi
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Stage installer and checksums
        run: |
          cp scripts/install.sh dist/skillctl-install.sh
          (
            cd dist
            sha256sum skillctl-v* > "skillctl-${RELEASE_TAG}-checksums.txt"
          )
      - name: Create GitHub release
        # softprops/action-gh-release v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
